[project]
name = "wp-gorila-agent"
version = "0.1.0"
description = "wp-gorila repair agent — automates WhatsApp session repair via ADB"
requires-python = ">=3.11"
authors = [{ name = "Gorila Software House" }]
dependencies = [
    "httpx>=0.27",
    "PyYAML>=6.0",
    "structlog>=24.1",
    "tenacity>=8.2",
    "pytesseract>=0.3.10",
    "Pillow>=10.0",
    "pydantic>=2.6",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
