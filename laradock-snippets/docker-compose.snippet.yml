### WhatsApp Service — wp-gorila (Baileys) ############################
  whatsapp-service:
    build:
      context: ../workspace/wp-gorila/whatsapp-service
      dockerfile: Dockerfile
    container_name: whatsapp-service
    restart: unless-stopped
    working_dir: /usr/src/app
    environment:
      - PORT=3000
      - LARAVEL_WEBHOOK_URL=http://nginx/api/whatsapp/webhook
      - AUTH_DIR=/usr/src/app/auth_info
    volumes:
      - ../workspace/wp-gorila/whatsapp-service/auth_info:/usr/src/app/auth_info
    ports:
      - "127.0.0.1:3020:3000"
    networks:
      - backend
    depends_on:
      - nginx
