# =====================================================================
# Snippet que o setup.sh anexa ao final do bloco `services:` do
# docker-compose.yml do Laradock.
# =====================================================================

### WhatsApp Service (Baileys) ############################
    whatsapp-service:
      build:
        context: ../whatsapp-service
        dockerfile: Dockerfile
      container_name: whatsapp-service
      restart: unless-stopped
      working_dir: /usr/src/app
      environment:
        - PORT=3000
        - LARAVEL_WEBHOOK_URL=http://nginx/api/whatsapp/webhook
        - AUTH_DIR=/usr/src/app/auth_info
        - MAX_MEDIA_BYTES=20971520
        # Mesmo valor de WEBHOOK_SECRET do .env do Laravel (HMAC sha256).
        - WEBHOOK_SECRET=${WEBHOOK_SECRET}
        # CSV de hosts permitidos pra media_url (https obrigatorio).
        - MEDIA_URL_ALLOWLIST=${MEDIA_URL_ALLOWLIST}
      volumes:
        # Multi-sessão: cada projeto vira uma subpasta em auth_info/{slug}/
        - ../whatsapp-service/auth_info:/usr/src/app/auth_info
      ports:
        # Exposto só em localhost pra debug. Laravel acessa via rede docker.
        - "127.0.0.1:3020:3000"
      networks:
        - backend
      depends_on:
        - nginx

### WhatsApp Queue Worker (Laravel) #######################
    whatsapp-worker:
      build:
        context: ./workspace
        args:
          - LARADOCK_PHP_VERSION=${PHP_VERSION}
          - INSTALL_BZ2=${WORKSPACE_INSTALL_BZ2}
          - INSTALL_GMP=${WORKSPACE_INSTALL_GMP}
          - INSTALL_GNUPG=${WORKSPACE_INSTALL_GNUPG}
          - INSTALL_SSH2=${WORKSPACE_INSTALL_SSH2}
          - INSTALL_SOAP=${WORKSPACE_INSTALL_SOAP}
          - INSTALL_XSL=${WORKSPACE_INSTALL_XSL}
          - INSTALL_LDAP=${WORKSPACE_INSTALL_LDAP}
          - INSTALL_IMAP=${WORKSPACE_INSTALL_IMAP}
          - INSTALL_MONGO=${WORKSPACE_INSTALL_MONGO}
          - INSTALL_AMQP=${WORKSPACE_INSTALL_AMQP}
          - INSTALL_CASSANDRA=${WORKSPACE_INSTALL_CASSANDRA}
          - INSTALL_GEARMAN=${WORKSPACE_INSTALL_GEARMAN}
          - INSTALL_MSSQL=${WORKSPACE_INSTALL_MSSQL}
          - INSTALL_NODE=${WORKSPACE_INSTALL_NODE}
          - INSTALL_NPM_GULP=${WORKSPACE_INSTALL_NPM_GULP}
          - INSTALL_NPM_BOWER=${WORKSPACE_INSTALL_NPM_BOWER}
          - INSTALL_NPM_VUE_CLI=${WORKSPACE_INSTALL_NPM_VUE_CLI}
          - INSTALL_NPM_ANGULAR_CLI=${WORKSPACE_INSTALL_NPM_ANGULAR_CLI}
          - PUID=${WORKSPACE_PUID}
          - PGID=${WORKSPACE_PGID}
          - TZ=${WORKSPACE_TIMEZONE}
      container_name: whatsapp-worker
      restart: unless-stopped
      working_dir: /var/www
      command: >
        php artisan queue:work redis
        --tries=3
        --max-time=3600
        --sleep=1
        --backoff=3
      volumes:
        - ${APP_CODE_PATH_HOST}:${APP_CODE_PATH_CONTAINER}${APP_CODE_CONTAINER_FLAG}
      networks:
        - backend
      depends_on:
        - redis
        - postgres
