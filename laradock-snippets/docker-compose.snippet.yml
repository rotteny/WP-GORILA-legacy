### WhatsApp Service - wp-gorila (Baileys) ############################
    whatsapp-service:
      build:
        context: ../workspace/wp-gorila/whatsapp-service
        dockerfile: Dockerfile
      container_name: whatsapp-service
      restart: unless-stopped
      working_dir: /usr/src/app
      environment:
        - PORT=3000
        - LARAVEL_WEBHOOK_URL=http://nginx/api/whatsapp/webhook
        - AUTH_DIR=/usr/src/app/auth_info
        # Anti-ban: throttle de envio por sessão (INCR atômico no Redis do Laradock).
        # O Redis do Laradock sobe com --requirepass; a senha vem do ~/laradock/.env
        # (REDIS_PASSWORD, default "secret_redis"). Sem ela: NOAUTH e o throttle vira no-op.
        - REDIS_HOST=redis
        - REDIS_PORT=6379
        - REDIS_PASSWORD=secret_redis
        - WA_RATE_BURST=5
        - WA_RATE_MAX_WAIT_MS=10000
      volumes:
        - ../workspace/wp-gorila/whatsapp-service/auth_info:/usr/src/app/auth_info
      ports:
        - "127.0.0.1:3020:3000"
      networks:
        - backend
      depends_on:
        - nginx
        - redis
